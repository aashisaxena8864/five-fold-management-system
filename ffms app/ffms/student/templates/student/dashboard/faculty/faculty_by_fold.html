{% extends "student/dashboard/faculty/base_faculty.html" %}

{% block faculty_content %}

<h2 class="page-title">{{ fold }} Faculty</h2>

<table class="data-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Activity</th>
            <th>Email</th>
        </tr>
    </thead>

    <tbody>
        {% for f in faculty %}
        <tr>
            <td>{{ f.name }}</td>
            <td>{{ f.department }}</td>
            <td>{{ f.activity }}</td>
            <td>{{ f.email }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="empty-row">
                No faculty assigned
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
