<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile | FFMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --primary:#5a2dd8;
    --secondary:#2575fc;
    --bg:#f3f6ff;
}

*{
    box-sizing:border-box;
    font-family:"Segoe UI", sans-serif;
}

body{
    margin:0;
    background:linear-gradient(120deg,#eef2ff,#f8fafc);
}

/* ===== CONTAINER ===== */
.container{
    max-width:820px;
    margin:50px auto;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

/* ===== HEADER ===== */
.profile-header{
    display:flex;
    align-items:center;
    gap:25px;
    margin-bottom:30px;
}

/* ===== PROFILE PIC ===== */
.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid var(--primary);
    cursor:pointer;
    transition:0.3s;
}

.avatar:hover{
    transform:scale(1.05);
}

/* ===== TITLE ===== */
h2{
    margin:0;
    color:var(--primary);
}

/* ===== ROWS ===== */
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.label{
    font-weight:600;
    color:#555;
}

.value,
input{
    color:#333;
    font-size:15px;
}

input{
    display:none;
    border:1px solid #c7d2fe;
    border-radius:8px;
    padding:6px 10px;
    width:60%;
}

/* ===== BUTTONS ===== */
.actions{
    margin-top:25px;
    display:flex;
    gap:15px;
}

.btn{
    padding:12px 22px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.edit{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;
}

.save{
    background:#22c55e;
    color:white;
    display:none;
}

.cancel{
    background:#ef4444;
    color:white;
    display:none;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* ===== BACK BUTTON ===== */
.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 22px;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:#fff;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
}

/* ===== IMAGE MODAL ===== */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal img{
    width:160px;
    height:200px;
    border-radius:8px;
    background:white;
    padding:10px;
}

.modal span{
    position:absolute;
    top:20px;
    right:30px;
    font-size:28px;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="profile-header">
        <img src="https://api.dicebear.com/7.x/thumbs/svg?seed=Aashi"
             class="avatar" onclick="openModal()">

        <div>
            <h2>👩‍🎓 Student Profile</h2>
            <p style="color:#666;">View & update your information</p>
        </div>
    </div>

    <!-- PROFILE FIELDS -->
    <div class="row">
        <span class="label">Name</span>
        <span class="value">Aashi Saxena</span>
        <input value="Aashi Saxena">
    </div>

    <div class="row">
        <span class="label">Student ID</span>
        <span class="value">BTBTC123</span>
        <input value="BTBTC123">
    </div>

    <div class="row">
        <span class="label">Course</span>
        <span class="value">B.Tech CSE</span>
        <input value="B.Tech CSE">
    </div>

    <div class="row">
        <span class="label">Semester</span>
        <span class="value">V</span>
        <input value="V">
    </div>

    <div class="row">
        <span class="label">Hostel</span>
        <span class="value">Shri Shanta Bhuwanam</span>
        <input value="Shri Shanta Bhuwanam">
    </div>

    <div class="row">
        <span class="label">Phone</span>
        <span class="value">9898****</span>
        <input value="9898****">
    </div>

    <div class="row">
        <span class="label">Email</span>
        <span class="value">btbtc123@aashi.com</span>
        <input value="btbtc123@aashi.com">
    </div>

    <div class="row">
        <span class="label">Activities</span>
        <span class="value">Badminton, Horse Riding</span>
        <input value="Badminton, Horse Riding">
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
        <button class="btn edit" onclick="editProfile()">✏ Edit Profile</button>
        <button class="btn save" onclick="saveProfile()">💾 Save</button>
        <button class="btn cancel" onclick="cancelEdit()">✖ Cancel</button>
    </div>

    <!-- BACK -->
    <a href="{% url 'student:student_dashboard' %}" class="back-btn">⬅ Back to Dashboard</a>
</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imgModal">
    <span onclick="closeModal()">✖</span>
    <img src="https://api.dicebear.com/7.x/thumbs/svg?seed=Aashi">
</div>

<script>
function editProfile(){
    document.querySelectorAll(".value").forEach(v=>v.style.display="none");
    document.querySelectorAll("input").forEach(i=>i.style.display="block");
    document.querySelector(".edit").style.display="none";
    document.querySelector(".save").style.display="inline-block";
    document.querySelector(".cancel").style.display="inline-block";
}

function saveProfile(){
    const values=document.querySelectorAll(".value");
    const inputs=document.querySelectorAll("input");

    inputs.forEach((i,idx)=>{
        values[idx].innerText=i.value;
    });

    cancelEdit();
}

function cancelEdit(){
    document.querySelectorAll(".value").forEach(v=>v.style.display="inline");
    document.querySelectorAll("input").forEach(i=>i.style.display="none");
    document.querySelector(".edit").style.display="inline-block";
    document.querySelector(".save").style.display="none";
    document.querySelector(".cancel").style.display="none";
}

function openModal(){
    document.getElementById("imgModal").style.display="flex";
}

function closeModal(){
    document.getElementById("imgModal").style.display="none";
}
</script>

</body>
</html>
