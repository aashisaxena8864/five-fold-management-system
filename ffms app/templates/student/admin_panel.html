<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Administration | FFMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            margin-bottom: 15px;
            color: #0056b3;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .toggle {
            margin-top: 8px;
        }

        .card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .status {
            font-weight: bold;
            color: green;
        }

        .note {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>System Administration Panel</h2>

    <!-- User Role Management -->
    <div class="section">
        <h3>User Role Management</h3>

        <label>Username</label>
        <input type="text" placeholder="Enter username">

        <label>Assign Role</label>
        <select>
            <option>Student</option>
            <option>Faculty</option>
            <option>Admin</option>
        </select>

        <button class="btn">Update Role</button>
        <button class="btn">Deactivate User</button>
    </div>

    <!-- System Settings -->
    <div class="section">
        <h3>System Settings</h3>

        <div class="toggle">
            <input type="checkbox" checked> Enable Notifications
        </div>

        <div class="toggle">
            <input type="checkbox"> Maintenance Mode
        </div>

        <div class="toggle">
            <input type="checkbox"> Dark Theme
        </div>
    </div>

    <!-- Data Management -->
    <div class="section">
        <h3>Data Management</h3>

        <button class="btn">Backup System</button>
        <button class="btn">Export Data</button>
        <button class="btn">Clear Cache</button>
    </div>

    <!-- System Health -->
    <div class="section">
        <h3>System Health</h3>

        <div class="card">
            Server Status: <span class="status">Online</span>
        </div>

        <div class="card">
            Active Users: 124
        </div>

        <div class="card">
            Last Backup: 2 hours ago
        </div>
    </div>

    
</div>

</body>
</html>
