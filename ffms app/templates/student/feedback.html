<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Feedback | FFMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --primary:#4f46e5;
    --secondary:#06b6d4;
    --accent:#f59e0b;
    --bg:#f1f5f9;
    --text:#1f2937;
}

*{
    box-sizing:border-box;
    font-family:"Segoe UI", sans-serif;
}

body{
    background:linear-gradient(135deg,#e0e7ff,#f0f9ff);
    margin:0;
    padding:0;
    color:var(--text);
}

/* ===== CONTAINER ===== */
.container{
    max-width:600px;
    margin:70px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.12);
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

/* ===== TITLE ===== */
h2{
    text-align:center;
    margin-bottom:25px;
    font-weight:700;
    color:var(--primary);
}

/* ===== LABELS ===== */
label{
    display:block;
    margin-top:18px;
    font-weight:600;
    color:#374151;
}

/* ===== INPUTS ===== */
select, textarea{
    width:100%;
    padding:12px 14px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid #c7d2fe;
    font-size:14px;
    outline:none;
    transition:0.3s;
    background:#f8fafc;
}

select:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(79,70,229,0.15);
    background:#ffffff;
}

textarea{
    resize:vertical;
    min-height:120px;
}

/* ===== BUTTON ===== */
button{
    margin-top:30px;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(79,70,229,0.35);
}

/* ===== FOOT NOTE ===== */
.note{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:#6b7280;
}

/* ===== BADGE STYLE HINTS ===== */
.hint{
    display:inline-block;
    background:#eef2ff;
    color:#4338ca;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:12px;
}
</style>
</head>

<body>

<div class="container">
    <div class="hint">💬 We value your feedback</div>

    <h2>Student Feedback Form</h2>

    <form method="post">
        <!-- Category -->
        <label for="category">Feedback Category</label>
        <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="faculty">👩‍🏫 Faculty</option>
            <option value="course">🎯 Events</option>
            <option value="infrastructure">🏫 Infrastructure</option>
            <option value="hostel">🏠 Facilities</option>
            <option value="canteen">🖥 System Issues</option>
            <option value="other">✨ Other</option>
        </select>

        <!-- Rating -->
        <label for="rating">Rating</label>
        <select id="rating" name="rating" required>
            <option value="">-- Select Rating --</option>
            <option value="5">⭐ Excellent (5)</option>
            <option value="4">😊 Very Good (4)</option>
            <option value="3">🙂 Good (3)</option>
            <option value="2">😐 Average (2)</option>
            <option value="1">😞 Poor (1)</option>
        </select>

        <!-- Comments -->
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments"
            placeholder="Write your feedback here..." required></textarea>

        <!-- Submit -->
        <button type="submit">🚀 Submit Feedback</button>
    </form>

    <div class="note">
        Your feedback helps us improve the system 🌱
    </div>
</div>

</body>
</html>
